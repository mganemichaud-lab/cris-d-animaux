<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cris d'animaux</title>
<style>
  :root {
    --bg: #faf7f2; --card: #ffffff; --text: #222; --muted: #777;
    --accent: #d9480f; --border: #e8e2d8; --nature: #eef6ea;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1a18; --card: #262422; --text: #eee; --muted: #999; --accent: #ff8a4c; --border: #3a3733; --nature: #26301f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
  h1 { margin: 0 0 8px; }
  .source { margin: 0 0 24px; color: var(--muted); font-size: .9rem; }
  .source a { color: var(--accent); }
  h2 { margin: 32px 0 12px; font-size: 1.4rem; }
  table { width: 100%; border-collapse: collapse; background: var(--card);
          border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  td { padding: 12px 14px; border-top: 1px solid var(--border); vertical-align: middle; }
  tr:first-child td { border-top: none; }
  .lang { color: var(--muted); width: 110px; }
  .word { font-size: 1.2rem; font-weight: 600; }
  .word small { display: block; font-weight: 400; font-size: .85rem; color: var(--muted); }
  .actions { white-space: nowrap; text-align: right; }
  tr.nature { background: var(--nature); }
  tr.nature .lang { color: var(--text); font-weight: 600; }
  tr.nature .word { font-size: 1rem; }
  tr.nature small a { color: var(--muted); }
  button, a.dl { font: inherit; font-size: .9rem; padding: 6px 12px; border-radius: 6px;
                 border: 1px solid var(--accent); cursor: pointer; text-decoration: none; }
  button { background: var(--accent); color: #fff; }
  a.dl { color: var(--accent); background: transparent; margin-left: 6px; }
  @media (max-width: 520px) {
    td { display: block; border-top: none; padding: 4px 14px; }
    tr td:first-child { border-top: 1px solid var(--border); padding-top: 12px; }
    tr:first-child td:first-child { border-top: none; }
    tr td:last-child { padding-bottom: 12px; text-align: left; }
  }
</style>
</head>
<body>
<main>
  <h1>Cris d'animaux</h1>
  <p class="source">Source : <a href="https://fr.wikipedia.org/wiki/Liste_d'onomatop%C3%A9es_dans_diff%C3%A9rentes_langues" target="_blank" rel="noopener">Wikipédia – Liste d'onomatopées dans différentes langues</a><br>
    Vrais cris : enregistrements de <a href="https://commons.wikimedia.org" target="_blank" rel="noopener">Wikimedia Commons</a> (auteur et licence indiqués pour chaque animal)</p>
  <div id="animaux"></div>
</main>

<script src="donnees.js"></script>
<script>
const conteneur = document.getElementById("animaux");
let lecteur = null;

for (const animal of ANIMAUX) {
  const titre = document.createElement("h2");
  titre.textContent = animal.nom;
  const table = document.createElement("table");

  const ajouterLigne = (langue, texte, note, code) => {
    const src = `audio/${animal.id}/${code}.mp3`;
    const tr = table.insertRow();
    tr.insertCell().outerHTML = `<td class="lang">${langue}</td>`;
    const mot = tr.insertCell();
    mot.className = "word";
    mot.textContent = texte;
    if (note) mot.insertAdjacentHTML("beforeend", `<small>${note}</small>`);
    const actions = tr.insertCell();
    actions.className = "actions";
    actions.innerHTML = `<button>▶ Écouter</button><a class="dl" href="${src}" download="${animal.id}-${code}.mp3">⬇ Télécharger</a>`;
    actions.querySelector("button").onclick = () => {
      if (lecteur) lecteur.pause();
      lecteur = new Audio(src);
      lecteur.play();
    };
    return tr;
  };

  // Le vrai cri de l'animal (enregistrement réel), en tête de tableau
  const n = animal.nature;
  ajouterLigne("🎙️ Vrai cri", "Enregistrement réel",
    `<a href="${n.source}" target="_blank" rel="noopener">${n.auteur}</a> · ${n.licence}`, "nature").className = "nature";
  for (const cri of animal.cris) ajouterLigne(cri.langue, cri.texte, cri.note, cri.code);
  conteneur.append(titre, table);
}
</script>
</body>
</html>
